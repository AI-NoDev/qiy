name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qiy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun test
      - name: Generated examples match the generator
        run: bun run examples:check
      - name: Coverage gate
        run: bun run coverage:check
      - name: SBOM
        run: bun run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: qiy-sbom
          path: qiy-sbom.json
          if-no-files-found: error
      - name: Build docs assets
        run: bun run docs:assets
      - name: Build documentation
        run: bun run docs:build
      - name: Bundle budget
        run: bun run bundle:check
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: E2E and accessibility
        run: bun run e2e

  generated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate fixture app
        run: bun run tools/cli.ts generate e2e/fixtures/app.qiy tmp/e2e-admin --sync
      - name: Install generated workspace
        working-directory: tmp/e2e-admin
        run: bun install
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      # One Playwright run for both projects: a second run cannot start the
      # dev servers while the first one's children still hold ports 3187/5187.
      - name: Generated app CRUD E2E and pixel regression
        run: bun run e2e:visual --project chromium
      - name: Generated API load smoke
        working-directory: tmp/e2e-admin
        run: |
          bun run dev:server > /tmp/qiy-load-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/v1/health > /dev/null
          bun run ../../tools/load-test.ts --url http://localhost:3000/api/v1/health --requests 100 --concurrency 10 --p95 1000
          bun run ../../tools/load-test.ts --url "http://localhost:3000/api/v1/products?page=1&pageSize=10" --duration 10 --warmup 20 --concurrency 20 --p95 1000 --p99 2000 --min-rps 20
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: generated-e2e-results
          path: test-results
          if-no-files-found: ignore
