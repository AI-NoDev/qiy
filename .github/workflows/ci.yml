name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qiy-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun run check
      - name: Test
        run: bun test
      - name: Coverage gate
        run: bun run coverage:check
      - name: SBOM
        run: bun run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: qiy-sbom
          path: qiy-sbom.json
          if-no-files-found: error
      - name: Build docs assets
        run: bun run docs:assets
      - name: Build documentation
        run: bun run docs:build
      - name: Bundle budget
        run: bun run bundle:check
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: E2E and accessibility
        run: bun run e2e

  generated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate fixture app
        run: bun run tools/cli.ts generate e2e/fixtures/app.qiy tmp/e2e-admin --sync
      - name: Install generated workspace
        working-directory: tmp/e2e-admin
        run: bun install
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Generated app CRUD E2E
        run: bun run e2e:generated
