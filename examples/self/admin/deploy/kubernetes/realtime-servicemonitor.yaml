apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qiy-supply-chain-erp-wms-realtime
  labels:
    app: qiy-supply-chain-erp-wms
spec:
  selector:
    matchLabels:
      app: qiy-supply-chain-erp-wms
  endpoints:
    - port: http
      path: /api/v1/realtime/outbox/metrics/prometheus
      interval: 30s
      scrapeTimeout: 10s
      authorization:
        type: Bearer
        credentials:
          name: qiy-supply-chain-erp-wms
          key: QIY_REALTIME_METRICS_TOKEN
